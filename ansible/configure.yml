---
- name: Configure Guardium appliance host
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ hostvars[inventory_hostname].hostname | default(ansible_host) }}"

    - name: Ensure /etc/hosts entry exists
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "{{ ansible_host }}"
        line: "{{ ansible_host }} {{ inventory_hostname }}"
        create: true

    - name: Verify Guardium services are running
      ansible.builtin.command: systemctl is-active guard
      register: guard_status
      failed_when: false
      changed_when: false

    - name: Report appliance status
      ansible.builtin.debug:
        msg: "Guardium appliance {{ inventory_hostname }} ({{ ansible_host }}): guard service {{ guard_status.stdout | default('unknown') }}"

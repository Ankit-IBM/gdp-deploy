all:
  children:

    # ── Guardium appliances ───────────────────────────────────────────────────
    guardium:
      children:
        collectors:
          hosts:
            gdp-col01:
              ansible_host: 10.50.20.31
              ansible_user: root
              ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
              guardium_role: collector
        aggregators:
          hosts:
            gdp-agg01:
              ansible_host: 10.50.20.21
              ansible_user: root
              ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
              guardium_role: aggregator

    # ── S-TAP Linux/Unix DB servers ───────────────────────────────────────────
    # Add your database servers here. S-TAP will be installed via SSH.
    stap_linux:
      vars:
        ansible_user: root
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
        guardium_collector_ip: 10.50.20.31
        guardium_version: "12.2"
        db_type: all
      hosts:
        # db-linux-01:
        #   ansible_host: 10.1.2.10
        #   db_type: oracle
        # db-linux-02:
        #   ansible_host: 10.1.2.11
        #   db_type: db2

    # ── S-TAP Windows DB servers ──────────────────────────────────────────────
    # Add your Windows database servers here. S-TAP installed via WinRM.
    stap_windows:
      vars:
        ansible_connection: winrm
        ansible_winrm_transport: ntlm
        ansible_port: 5985
        guardium_collector_ip: 10.50.20.31
        guardium_version: "12.2"
        db_type: mssql
      hosts:
        # db-win-01:
        #   ansible_host: 10.1.2.20
        #   ansible_user: DOMAIN\svc-guardium
        #   ansible_password: "{{ lookup('env','WIN_DB01_PASS') }}"
        #   db_type: mssql
